[package]
name = "vibeflow"
version = "0.3.4"
description = "VibeFlow"
authors = ["DerJanniku"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["image-png", "tray-icon"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-autostart = "2.0.0"
tauri-plugin-global-shortcut = "2.0.0"
tauri-plugin-log = "2.0.0"
tauri-plugin-updater = "2.0.0"
tauri-plugin-process = "2.0.0"
window-vibrancy = "0.6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
cpal = "0.17"
rodio = "0.22" # For feedback sounds
log = "0.4"
num_cpus = "1.16"
hound = "3.5"
enigo = "0.6"
anyhow = "1.0"
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"
arboard = "3.4"
parking_lot = "0.12"
crossbeam = "0.8"
webrtc-vad = "0.4"
zeroize = { version = "1.7", features = ["derive"] }
sysinfo = "0.39"
once_cell = "1.18"
lazy_static = "1.4"
base64 = "0.22"
whisper-rs = "0.16"
nnnoiseless = "0.5.2"
tract-onnx = "0.23.2"
tract-core = "0.23.2"

# active-win-pos-rs crashes on Wayland; only include on Windows/macOS
[target.'cfg(not(target_os = "linux"))'.dependencies]
active-win-pos-rs = "0.11"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
